<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">Mi Organizador</h1>

        <!-- Navegación por Pestañas Principales -->
        <div class="flex justify-between border-b pb-3 mb-4 text-sm font-semibold">
            <button id="tab-hija" onclick="setTab('hija')" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">SUHAILA</button>
            <button id="tab-casa" onclick="setTab('casa')" class="text-gray-400 pb-1">CASA</button>
            <button id="tab-recordatorios" onclick="setTab('recordatorios')" class="text-gray-400 pb-1">RECORDATORIOS</button>
        </div>

        <!-- Subcategorías (Se filtran según la pestaña principal) -->
        <div id="subnav" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>

        <!-- Formulario para añadir ítem -->
        <div class="bg-gray-50 p-4 rounded-xl mb-6 shadow-inner">
            <h2 class="text-xs font-bold text-gray-500 uppercase mb-2" id="form-title">Añadir Tarea</h2>
            <div class="space-y-2">
                <input type="text" id="input-item" placeholder="Escribe aquí..." class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="datetime-container" class="hidden">
                    <input type="datetime-local" id="input-date" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <button onclick="agregarItem()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700">Guardar</button>
            </div>
        </div>

        <!-- Lista de tareas/ítems -->
        <div id="lista-container" class="space-y-2">
            <p class="text-center text-gray-400 text-sm">Cargando datos...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyusACb-e4IIODnUklcfFn5Zv10zr51stxNMH2FyHJmdIWn_-X9gafIy_LvferLt_uDgg/exec"; //

        let datosGlobales = { hija: [], casa: [], recordatorios: [] };
        let tabActual = 'hija';
        let subCategoriaActual = 'Escuela';

        const subCategorias = {
            hija: ['Escuela', 'Baile', 'Inglés', 'Necesidades'],
            casa: ['Lista de la Compra', 'Tareas'],
            recordatorios: ['General']
        };

        function setTab(tab) {
            tabActual = tab;
            subCategoriaActual = subCategorias[tab][0];

            ['hija', 'casa', 'recordatorios'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    el.className = "text-indigo-600 border-b-2 border-indigo-600 pb-1 font-bold";
                } else {
                    el.className = "text-gray-400 pb-1 font-semibold";
                }
            });

            document.getElementById('datetime-container').classList.toggle('hidden', tab !== 'recordatorios');
            renderSubNav();
            renderLista();
        }

        function renderSubNav() {
            const container = document.getElementById('subnav');
            container.innerHTML = '';
            subCategorias[tabActual].forEach(sub => {
                const btn = document.createElement('button');
                btn.innerText = sub;
                btn.className = `px-3 py-1 text-xs rounded-full whitespace-nowrap ${sub === subCategoriaActual ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-gray-100 text-gray-500'}`;
                btn.onclick = () => { subCategoriaActual = sub; renderSubNav(); renderLista(); };
                container.appendChild(btn);
            });
        }

        function renderLista() {
            const container = document.getElementById('lista-container');
            container.innerHTML = '';

            let items = [];
            if (tabActual === 'hija') {
                items = datosGlobales.hija.filter(row => row[1] === subCategoriaActual);
            } else if (tabActual === 'casa') {
                items = datosGlobales.casa.filter(row => row[1] === subCategoriaActual);
            } else {
                items = datosGlobales.recordatorios;
            }

            if (items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">No hay elementos guardados.</p>';
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-white border rounded-xl shadow-sm text-sm";
                
                const texto = tabActual === 'recordatorios' ? `${item[1]} <br><span class="text-xs text-indigo-500">${new Date(item[2]).toLocaleString()}</span>` : item[2];
                
                div.innerHTML = `
                    <span class="${item[3] ? 'line-through text-gray-400' : 'text-gray-800'}">${texto}</span>
                    <input type="checkbox" ${item[3] ? 'checked' : ''} onchange="toggleItem('${item[0]}', this.checked)" class="h-4 w-4 text-indigo-600 rounded">
                `;
                container.appendChild(div);
            });
        }

        function cargarDatos() {
            fetch(API_URL + "?action=getData")
                .then(res => res.json())
                .then(data => {
                    datosGlobales = data;
                    renderSubNav();
                    renderLista();
                });
        }

        function agregarItem() {
            const input = document.getElementById('input-item');
            const dateInput = document.getElementById('input-date');
            if (!input.value) return;

            const payload = {
                action: 'add',
                sheet: tabActual === 'hija' ? 'Hija' : (tabActual === 'casa' ? 'Casa' : 'Recordatorios'),
                category: subCategoriaActual,
                item: input.value,
                date: dateInput.value
            };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(() => {
                    input.value = '';
                    dateInput.value = '';
                    cargarDatos();
                });
        }

        function toggleItem(id, completed) {
            const payload = {
                action: 'toggle',
                sheet: tabActual === 'hija' ? 'Hija' : (tabActual === 'casa' ? 'Casa' : 'Recordatorios'),
                id: id,
                completed: completed
            };
            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        }

        // Carga inicial
        cargarDatos();
    </script>
</body>
</html>
