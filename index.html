<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">🏡 Mi Organizador</h1>

        <!-- Navegación por Pestañas Principales con Emojis -->
        <div class="flex justify-between border-b pb-3 mb-4 text-sm font-semibold">
            <button id="tab-hija" onclick="setTab('hija')" class="text-indigo-600 border-b-2 border-indigo-600 pb-1 font-bold">👧 SUHAILA 💗</button>
            <button id="tab-casa" onclick="setTab('casa')" class="text-gray-400 pb-1">🏠 CASA</button>
            <button id="tab-recordatorios" onclick="setTab('recordatorios')" class="text-gray-400 pb-1">⏰ RECORDATORIOS 📝</button>
        </div>

        <!-- Subcategorías con Emojis -->
        <div id="subnav" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>

        <!-- Formulario para añadir ítem -->
        <div class="bg-gray-50 p-4 rounded-xl mb-6 shadow-inner">
            <h2 class="text-xs font-bold text-gray-500 uppercase mb-2" id="form-title">➕ Añadir Tarea</h2>
            <div class="space-y-2">
                <input type="text" id="input-item" placeholder="Escribe aquí..." class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="datetime-container" class="hidden">
                    <input type="datetime-local" id="input-date" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <button id="btn-guardar" onclick="agregarItem()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700">💾 Guardar</button>
            </div>
        </div>

        <!-- Lista de tareas/ítems -->
        <div id="lista-container" class="space-y-2">
            <p class="text-center text-gray-400 text-sm py-4">⏳ Cargando datos...</p>
        </div>
    </div>

    <script>
        // PEGA TU URL DE APPS SCRIPT ENTRE LAS COMILLAS DE ABAJO
        const API_URL = "https://script.google.com/macros/s/AKfycbyusACb-e4IIODnUklcfFn5Zv10zr51stxNMH2FyHJmdIWn_-X9gafIy_LvferLt_uDgg/exec"; 

        let datosGlobales = { hija: [], casa: [], recordatorios: [] };
        let tabActual = 'hija';
        let subCategoriaActual = '🏫 Escuela';

        const subCategorias = {
            hija: ['🏫 Escuela', '💃 Baile', '🇬🇧 Inglés', '🎒 Necesidades'],
            casa: ['🛒 Lista de la Compra', '🧹 Tareas'],
            recordatorios: ['📌 General']
        };

        function setTab(tab) {
            tabActual = tab;
            subCategoriaActual = subCategorias[tab][0];

            ['hija', 'casa', 'recordatorios'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) {
                    if (t === tab) {
                        el.className = "text-indigo-600 border-b-2 border-indigo-600 pb-1 font-bold";
                    } else {
                        el.className = "text-gray-400 pb-1 font-semibold";
                    }
                }
            });

            const dtContainer = document.getElementById('datetime-container');
            if (dtContainer) {
                dtContainer.classList.toggle('hidden', tab !== 'recordatorios');
            }

            renderSubNav();
            renderLista();
        }

        function renderSubNav() {
            const container = document.getElementById('subnav');
            if (!container) return;
            container.innerHTML = '';
            subCategorias[tabActual].forEach(sub => {
                const btn = document.createElement('button');
                btn.innerText = sub;
                btn.className = `px-3 py-1 text-xs rounded-full whitespace-nowrap ${sub === subCategoriaActual ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-gray-100 text-gray-500'}`;
                btn.onclick = () => { subCategoriaActual = sub; renderSubNav(); renderLista(); };
                container.appendChild(btn);
            });
        }

        function limpiarTexto(str) {
            if (!str) return '';
            // Función para comparar categorías ignorando emojis y espacios
            return String(str).replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim().toLowerCase();
        }

        function renderLista() {
            const container = document.getElementById('lista-container');
            if (!container) return;
            container.innerHTML = '';

            let items = [];
            const subLimpia = limpiarTexto(subCategoriaActual);

            if (tabActual === 'hija') {
                items = (datosGlobales.hija || []).filter(row => limpiarTexto(row[1]) === subLimpia);
            } else if (tabActual === 'casa') {
                items = (datosGlobales.casa || []).filter(row => limpiarTexto(row[1]) === subLimpia);
            } else {
                items = datosGlobales.recordatorios || [];
            }

            if (!items || items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">✨ No hay elementos guardados.</p>';
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-white border rounded-xl shadow-sm text-sm";
                
                let texto = item[2] || item[1] || "";
                if (tabActual === 'recordatorios') {
                    const fechaRaw = item[4] || item[2];
                    const fechaFormat = fechaRaw ? new Date(fechaRaw).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
                    texto = `<div><span class="font-medium">🔔 ${item[1] || item[2]}</span><br><span class="text-xs text-indigo-500">📅 ${fechaFormat}</span></div>`;
                } else {
                    texto = `<span>📌 ${texto}</span>`;
                }
                
                const isChecked = item[3] === true || item[3] === "true";

                div.innerHTML = `
                    <div class="${isChecked ? 'line-through text-gray-400' : 'text-gray-800'}">${texto}</div>
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleItem('${item[0]}', this.checked)" class="h-4 w-4 text-indigo-600 rounded">
                `;
                container.appendChild(div);
            });
        }

        function cargarDatos() {
            if (!API_URL || API_URL.includes("PEGAR_AQUI")) {
                document.getElementById('lista-container').innerHTML = '<p class="text-center text-red-500 text-sm py-4">⚠️ Por favor, añade tu URL de Apps Script.</p>';
                return;
            }

            fetch(API_URL + "?action=getData")
                .then(res => res.json())
                .then(data => {
                    datosGlobales = data;
                    renderLista();
                })
                .catch(err => {
                    console.error("Error al cargar datos:", err);
                    document.getElementById('lista-container').innerHTML = '<p class="text-center text-red-400 text-sm py-4">❌ Error al conectar con Google Sheets.</p>';
                });
        }

        function agregarItem() {
            const input = document.getElementById('input-item');
            const dateInput = document.getElementById('input-date');
            const btn = document.getElementById('btn-guardar');

            if (!input.value.trim()) return;

            btn.innerText = "⏳ Guardando...";
            btn.disabled = true;

            let sheetName = "Recordatorios";
            if (tabActual === 'hija') sheetName = "SUHAILA";
            if (tabActual === 'casa') sheetName = "CASA";

            const payload = {
                action: 'add',
                sheet: sheetName,
                category: subCategoriaActual,
                item: input.value,
                date: dateInput ? dateInput.value : ""
            };

            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload) 
            })
            .then(res => res.json())
            .then(data => {
                input.value = '';
                if(dateInput) dateInput.value = '';
                btn.innerText = "💾 Guardar";
                btn.disabled = false;
                cargarDatos();
            })
            .catch(err => {
                console.error("Error al guardar:", err);
                btn.innerText = "💾 Guardar";
                btn.disabled = false;
                setTimeout(cargarDatos, 1000);
            });
        }

        function toggleItem(id, completed) {
            let sheetName = "Recordatorios";
            if (tabActual === 'hija') sheetName = "SUHAILA";
            if (tabActual === 'casa') sheetName = "CASA";

            const payload = {
                action: 'toggle',
                sheet: sheetName,
                id: id,
                completed: completed
            };

            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload) 
            });
        }

        // Inicializar la app
        renderSubNav();
        cargarDatos();
    </script>
</body>
</html>
