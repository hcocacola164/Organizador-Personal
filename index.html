<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">🏡 Mi Organizador</h1>

        <!-- Navegación por Pestañas Principales -->
        <div class="flex justify-between border-b pb-3 mb-4 text-sm font-semibold">
            <button onclick="setTab('suhaila')" id="btn-suhaila" class="text-indigo-600 border-b-2 border-indigo-600 pb-1 font-bold">SUHAILA👧🏼🩷</button>
            <button onclick="setTab('casa')" id="btn-casa" class="text-gray-400 pb-1">CASA 🏠</button>
            <button onclick="setTab('recordatorios')" id="btn-recordatorios" class="text-gray-400 pb-1">Recordatorios📝⏰</button>
        </div>

        <!-- Subcategorías -->
        <div id="subnav" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>

        <!-- Formulario para añadir ítem -->
        <div class="bg-gray-50 p-4 rounded-xl mb-6 shadow-inner">
            <h2 class="text-xs font-bold text-gray-500 uppercase mb-2">➕ Añadir Tarea</h2>
            <div class="space-y-2">
                <input type="text" id="input-item" placeholder="Escribe aquí..." class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="datetime-container" class="hidden">
                    <input type="datetime-local" id="input-date" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <button onclick="agregarItem()" id="btn-guardar" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700">💾 Guardar</button>
            </div>
        </div>

        <!-- Lista de tareas -->
        <div id="lista-container" class="space-y-2">
            <p class="text-center text-gray-400 text-sm py-4">⏳ Cargando datos...</p>
        </div>
    </div>

    <script>
        // 👇 PEGA TU URL DE APPS SCRIPT AQUÍ
        const API_URL = "https://script.google.com/macros/s/AKfycbyusACb-e4IIODnUklcfFn5Zv10zr51stxNMH2FyHJmdIWn_-X9gafIy_LvferLt_uDgg/exec"; 

        let cacheDatos = { suhaila: [], casa: [], recordatorios: [] };
        let tabActual = 'suhaila';
        let subActual = 'Escuela';

        const subs = {
            suhaila: ['Escuela', 'Baile', 'Inglés', 'Necesidades'],
            casa: ['Lista de la Compra', 'Tareas'],
            recordatorios: ['General']
        };

        function setTab(t) {
            tabActual = t;
            subActual = subs[t][0];

            ['suhaila', 'casa', 'recordatorios'].forEach(tab => {
                const el = document.getElementById(`btn-${tab}`);
                if(tab === t) {
                    el.className = "text-indigo-600 border-b-2 border-indigo-600 pb-1 font-bold";
                } else {
                    el.className = "text-gray-400 pb-1 font-semibold";
                }
            });

            document.getElementById('datetime-container').classList.toggle('hidden', t !== 'recordatorios');
            renderSubnav();
            renderLista();
        }

        function renderSubnav() {
            const nav = document.getElementById('subnav');
            nav.innerHTML = '';
            subs[tabActual].forEach(s => {
                const b = document.createElement('button');
                b.innerText = s;
                b.className = `px-3 py-1 text-xs rounded-full whitespace-nowrap ${s === subActual ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-gray-100 text-gray-500'}`;
                b.onclick = () => { subActual = s; renderSubnav(); renderLista(); };
                nav.appendChild(b);
            });
        }

        function renderLista() {
            const container = document.getElementById('lista-container');
            container.innerHTML = '';

            let items = [];
            if (tabActual === 'suhaila') {
                items = (cacheDatos.suhaila || []).filter(r => String(r[1]).trim().toLowerCase() === subActual.trim().toLowerCase());
            } else if (tabActual === 'casa') {
                items = (cacheDatos.casa || []).filter(r => String(r[1]).trim().toLowerCase() === subActual.trim().toLowerCase());
            } else {
                items = cacheDatos.recordatorios || [];
            }

            if (items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">✨ No hay elementos guardados.</p>';
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-white border rounded-xl shadow-sm text-sm";
                
                let texto = "";
                let completado = false;

                if (tabActual === 'recordatorios') {
                    let titulo = item[1] || ""; // Columna B (Titulo)
                    let fechaRaw = item[2];    // Columna C (FechaHora)
                    let fechaF = fechaRaw ? new Date(fechaRaw).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }) : '';
                    texto = `<div><span class="font-medium">🔔 ${titulo}</span><br><span class="text-xs text-indigo-500">📅 ${fechaF}</span></div>`;
                } else {
                    texto = `<span>📌 ${item[2] || ""}</span>`; // Columna C (Tarea)
                    completado = item[3] === true || item[3] === "true"; // Columna D
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        ${tabActual !== 'recordatorios' ? `<input type="checkbox" ${completado ? 'checked' : ''} onchange="toggleItem('${item[0]}', this.checked)" class="h-4 w-4 text-indigo-600 rounded">` : ''}
                        <div class="${completado ? 'line-through text-gray-400' : 'text-gray-800'}">${texto}</div>
                    </div>
                    <button onclick="eliminarItem('${item[0]}')" class="text-red-400 hover:text-red-600 p-1 font-bold text-xs">🗑️</button>
                `;
                container.appendChild(div);
            });
        }

        function cargarDatos() {
            fetch(API_URL + "?action=getData")
                .then(r => r.json())
                .then(data => {
                    cacheDatos = data;
                    renderLista();
                })
                .catch(err => console.error("Error cargando:", err));
        }

        function agregarItem() {
            const txt = document.getElementById('input-item');
            const date = document.getElementById('input-date');
            const btn = document.getElementById('btn-guardar');

            if (!txt.value.trim()) return;

            btn.innerText = "⏳ Guardando...";
            btn.disabled = true;

            const payload = {
                action: 'add',
                sheet: tabActual,
                category: subActual,
                item: txt.value.trim(),
                date: (tabActual === 'recordatorios' && date) ? date.value : ""
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                txt.value = '';
                if(date) date.value = '';
                btn.innerText = "💾 Guardar";
                btn.disabled = false;
                cargarDatos();
            })
            .catch(err => {
                console.error("Error guardando:", err);
                btn.innerText = "💾 Guardar";
                btn.disabled = false;
            });
        }

        function toggleItem(id, estado) {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'toggle', sheet: tabActual, id: id, completed: estado })
            });
        }

        function eliminarItem(id) {
            if(tabActual === 'suhaila') cacheDatos.suhaila = cacheDatos.suhaila.filter(r => String(r[0]) !== String(id));
            if(tabActual === 'casa') cacheDatos.casa = cacheDatos.casa.filter(r => String(r[0]) !== String(id));
            if(tabActual === 'recordatorios') cacheDatos.recordatorios = cacheDatos.recordatorios.filter(r => String(r[0]) !== String(id));
            renderLista();

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', sheet: tabActual, id: id })
            }).then(() => setTimeout(cargarDatos, 500));
        }

        setTab('suhaila');
        cargarDatos();
    </script>
</body>
</html>
