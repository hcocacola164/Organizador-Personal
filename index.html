<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Casa</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --accent: #2c3e50;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      border: none;
      background: #e0e6ed;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: var(--accent);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input, select, button {
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    input[type="text"] { flex: 1; min-width: 200px; }

    button.btn-add {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
    }

    .task-item:last-child { border-bottom: none; }

    .task-info { display: flex; align-items: center; gap: 12px; }
    .task-title { font-weight: 600; }
    .task-category {
      background: #e1f5fe;
      color: #0288d1;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .task-dates { font-size: 0.85rem; color: #777; }

    .btn-delete {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 10px;
    }

    /* Botón de Voz Flotante */
    .mic-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 30px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }

    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.listening { background: var(--danger); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(231, 76, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }

    /* Modal / Pop-up del Día */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .modal-overlay.show {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 600px;
      padding: 25px;
      border-radius: 16px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .close-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Organizador Tablet</h1>
    <div id="clock" style="font-size: 1.2rem; font-weight: bold;"></div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('SUHAILA')">SUHAILA</button>
    <button class="tab-btn" onclick="switchTab('CASA')">CASA</button>
    <button class="tab-btn" onclick="switchTab('Recordatorios')">RECORDATORIOS</button>
  </div>

  <!-- Panel Suhaila -->
  <div id="panel-SUHAILA" class="panel active card">
    <h2>Tareas Suhaila</h2>
    <div class="form-group">
      <input type="text" id="cat-SUHAILA" placeholder="Categoría (ej: Baile, Cole)">
      <input type="text" id="task-SUHAILA" placeholder="Tarea">
      <input type="date" id="start-SUHAILA">
      <input type="date" id="end-SUHAILA">
      <button class="btn-add" onclick="addTask('SUHAILA')">Añadir</button>
    </div>
    <ul id="list-SUHAILA" class="task-list"></ul>
  </div>

  <!-- Panel Casa -->
  <div id="panel-CASA" class="panel card">
    <h2>Tareas Casa</h2>
    <div class="form-group">
      <input type="text" id="cat-CASA" placeholder="Categoría (ej: Limpieza, Compras)">
      <input type="text" id="task-CASA" placeholder="Tarea">
      <input type="date" id="start-CASA">
      <input type="date" id="end-CASA">
      <button class="btn-add" onclick="addTask('CASA')">Añadir</button>
    </div>
    <ul id="list-CASA" class="task-list"></ul>
  </div>

  <!-- Panel Recordatorios -->
  <div id="panel-Recordatorios" class="panel card">
    <h2>Recordatorios (Avisos Telegram)</h2>
    <div class="form-group">
      <input type="text" id="task-Recordatorios" placeholder="Título del Recordatorio">
      <input type="datetime-local" id="date-Recordatorios">
      <button class="btn-add" onclick="addReminder()">Añadir Recordatorio</button>
    </div>
    <ul id="list-Recordatorios" class="task-list"></ul>
  </div>

  <!-- Botón de Micrófono -->
  <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecognition()">🎙️</button>

  <!-- Ventana Emergente Matutina -->
  <div class="modal-overlay" id="dailyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>☀️ Tareas Programadas para Hoy</h2>
        <button class="close-btn" onclick="closeModal()">Cerrar</button>
      </div>
      <ul id="dailyTaskList" class="task-list"></ul>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON LA URL DE TU SCRIPT DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbyusACb-e4IIODnUklcfFn5Zv10zr51stxNMH2FyHJmdIWn_-X9gafIy_LvferLt_uDgg/exec";

    let currentTab = "SUHAILA";
    let globalData = { suhaila: [], casa: [], recordatorios: [] };

    // Reloj
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
    }, 1000);

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        globalData = await res.json();
        renderLists();
        checkDailyTasks();
      } catch (err) {
        console.error("Error cargando datos:", err);
      }
    }

    function renderLists() {
      renderCategoryList('SUHAILA', globalData.suhaila);
      renderCategoryList('CASA', globalData.casa);
      renderReminderList(globalData.recordatorios);
    }

    function renderCategoryList(sheet, items) {
      const listEl = document.getElementById(`list-${sheet}`);
      listEl.innerHTML = '';
      
      // Ordenar: las más recientes arriba (mayor ID)
      items.sort((a, b) => b[0] - a[0]);

      items.forEach(row => {
        const [id, cat, task, start, end, done] = row;
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <div class="task-info">
            <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleTask('${sheet}', ${id}, this.checked)">
            <div>
              <span class="task-category">${cat || 'General'}</span>
              <span class="task-title" style="${done ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${task}</span>
              <div class="task-dates">🗓️ ${start || 'S/F'} al ${end || 'S/F'}</div>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteTask('${sheet}', ${id})">🗑️</button>
        `;
        listEl.appendChild(li);
      });
    }

    function renderReminderList(items) {
      const listEl = document.getElementById('list-Recordatorios');
      listEl.innerHTML = '';
      items.sort((a, b) => b[0] - a[0]);

      items.forEach(row => {
        const [id, task, dateStr, a7, a1] = row;
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <div class="task-info">
            <span class="task-title">${task}</span>
            <div class="task-dates">⏰ ${dateStr ? new Date(dateStr).toLocaleString() : ''}</div>
          </div>
          <button class="btn-delete" onclick="deleteTask('Recordatorios', ${id})">🗑️</button>
        `;
        listEl.appendChild(li);
      });
    }

    async function addTask(sheet) {
      const cat = document.getElementById(`cat-${sheet}`).value;
      const task = document.getElementById(`task-${sheet}`).value;
      const start = document.getElementById(`start-${sheet}`).value;
      const end = document.getElementById(`end-${sheet}`).value;

      if (!task) return alert("Escribe una tarea");

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', sheet, category: cat, item: task, startDate: start, endDate: end })
      });

      document.getElementById(`cat-${sheet}`).value = '';
      document.getElementById(`task-${sheet}`).value = '';
      loadData();
    }

    async function addReminder() {
      const task = document.getElementById('task-Recordatorios').value;
      const date = document.getElementById('date-Recordatorios').value;

      if (!task) return alert("Escribe un recordatorio");

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', sheet: 'Recordatorios', item: task, date })
      });

      document.getElementById('task-Recordatorios').value = '';
      loadData();
    }

    async function toggleTask(sheet, id, completed) {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'toggle', sheet, id, completed })
      });
      loadData();
    }

    async function deleteTask(sheet, id) {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', sheet, id })
      });
      loadData();
    }

    // Modal Matutino
    function checkDailyTasks() {
      const todayStr = new Date().toISOString().split('T')[0];
      let todayTasks = [];

      const filterFn = (items, sheetName) => {
        items.forEach(row => {
          const [id, cat, task, start, end, done] = row;
          if (!done && start && end) {
            if (start <= todayStr && todayStr <= end) {
              todayTasks.push({ id, cat, task, start, end, sheetName, rowId: id });
            }
          }
        });
      };

      filterFn(globalData.suhaila, 'SUHAILA');
      filterFn(globalData.casa, 'CASA');

      // Ordenar las más recientes arriba
      todayTasks.sort((a, b) => b.rowId - a.rowId);

      if (todayTasks.length > 0) {
        const modalList = document.getElementById('dailyTaskList');
        modalList.innerHTML = '';
        todayTasks.forEach(t => {
          const li = document.createElement('li');
          li.className = 'task-item';
          li.innerHTML = `
            <div>
              <span class="task-category">[${t.sheetName}] ${t.cat || 'General'}</span>
              <div class="task-title">${t.task}</div>
            </div>
          `;
          modalList.appendChild(li);
        });
        document.getElementById('dailyModal').classList.add('show');
      }
    }

    function closeModal() {
      document.getElementById('dailyModal').classList.remove('show');
    }

    // Reconocimiento de Voz
    let recognition;
    let isListening = false;

    function toggleVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Tu navegador no soporta reconocimiento de voz.");
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        console.log("Dictado:", text);
        await processVoiceCommand(text);
      };

      recognition.start();
    }

    async function processVoiceCommand(text) {
      let sheet = "SUHAILA";
      if (text.includes("casa")) sheet = "CASA";
      if (text.includes("recordatorio")) sheet = "Recordatorios";

      let category = "General";
      if (text.includes("baile")) category = "Baile";
      if (text.includes("cole") || text.includes("colegio")) category = "Cole";
      if (text.includes("limpieza")) category = "Limpieza";
      if (text.includes("compra")) category = "Compra";

      // Detectar fecha del próximo día mencionado
      const days = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
      let targetDate = new Date();
      let foundDay = false;

      days.forEach((day, idx) => {
        if (text.includes(day)) {
          foundDay = true;
          let distance = (idx + 7 - targetDate.getDay()) % 7;
          if (distance === 0) distance = 7;
          targetDate.setDate(targetDate.getDate() + distance);
        }
      });

      const startDateStr = targetDate.toISOString().split('T')[0];
      
      // Fecha fin: al día siguiente
      let endDateObj = new Date(targetDate);
      endDateObj.setDate(endDateObj.getDate() + 1);
      const endDateStr = endDateObj.toISOString().split('T')[0];

      // Limpiar texto para extraer la tarea
      let cleanTask = text
        .replace(/añade|agregar|pon|en|a|para|el|la|categoría|casa|suhaila|recordatorio|baile|cole|limpieza|compra|lunes|martes|miércoles|jueves|viernes|sábado|domingo/g, "")
        .trim();

      if (!cleanTask) cleanTask = "Tarea dictada por voz";

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'add', 
          sheet, 
          category, 
          item: cleanTask, 
          startDate: startDateStr, 
          endDate: endDateStr 
        })
      });

      const msg = `Añadida la tarea ${cleanTask} a ${sheet} en la categoría ${category}`;
      speak(msg);
      loadData();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Cargar al iniciar
    loadData();
  </script>
</body>
</html>
